version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: fastapi-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi-module-design
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: fastapi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly yes # 开启Redis AOF持久化
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru


volumes:
  postgres_data:
  redis_data: